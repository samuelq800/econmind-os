name: Release · World V2 selected-country API reader
run-name: Release World V2 selected-country API reader · @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RELEASE_WORLD_V2_API_READER
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      WORLD_V2_API_READER_SOURCE_COMMIT: 181665ca04b9ac352ce080ff75276fb9ea50a186
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed target and explicit authorization
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "RELEASE_WORLD_V2_API_READER"
          test "$SUPABASE_PROJECT_REF" = "vimksjrhaxdpnkvgsavz"
          test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Fetch immutable reviewed World V2 source
        run: |
          source_root="$RUNNER_TEMP/world-v2-api-reader-source"
          git clone --no-checkout https://github.com/samuelq800/econmind-os-world-simulation.git "$source_root"
          git -C "$source_root" checkout --detach "$WORLD_V2_API_READER_SOURCE_COMMIT"
          test "$(git -C "$source_root" rev-parse HEAD)" = "$WORLD_V2_API_READER_SOURCE_COMMIT"
          test "$(git -C "$source_root" remote get-url origin)" = "https://github.com/samuelq800/econmind-os-world-simulation.git"
          test -z "$(git -C "$source_root" status --porcelain=v1 --untracked-files=all)"
          printf 'WORLD_V2_API_READER_SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"
      - name: Render one reviewed role and policy request without executing it
        run: |
          node "$WORLD_V2_API_READER_SOURCE_ROOT/scripts/render-world-v2-api-reader-release.mjs" \
            "$WORLD_V2_API_READER_SOURCE_ROOT" "$RUNNER_TEMP/world-v2-api-reader-request.json"
      - name: Execute exactly one atomic management API request
        id: request
        continue-on-error: true
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data-binary "@$RUNNER_TEMP/world-v2-api-reader-request.json" \
            --output "$RUNNER_TEMP/world-v2-api-reader-response.json"
      - name: Verify exact role and policy readback
        id: evidence
        if: steps.request.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p artifacts/world-v2-api-reader
          node scripts/verify-world-v2-api-reader-release.mjs \
            "$RUNNER_TEMP/world-v2-api-reader-response.json" \
            artifacts/world-v2-api-reader/evidence.json
      - name: Record uncertain or failed outcome
        if: steps.request.outcome != 'success' || steps.evidence.outcome != 'success'
        run: |
          mkdir -p artifacts/world-v2-api-reader
          node scripts/write-world-v2-release-unknown.mjs \
            --output artifacts/world-v2-api-reader/outcome-unknown.json
      - name: Preserve non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v2-api-reader-evidence
          path: artifacts/world-v2-api-reader/*.json
          if-no-files-found: warn
      - name: Fail closed on incomplete verification
        if: steps.request.outcome != 'success' || steps.evidence.outcome != 'success'
        run: exit 1
