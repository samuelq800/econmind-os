name: Auth · Publish direct registration and current-policy receipts
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261023000000_direct_registration_policy_receipts.sql"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      DIRECT_REGISTRATION_APPROVED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - run: pnpm install --frozen-lockfile
      - name: Verify exact release source
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/direct-registration.test.ts tests/registration-consent.test.ts tests/direct-registration-publisher.test.ts tests/group-registration.test.ts
      - name: Publish only dedicated registration migration
        run: node scripts/publish-direct-registration.mjs
      - name: Publish only reviewed registration functions
        run: |
          supabase functions deploy register-direct --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy register-with-group-code --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify backend and safe negative request without creating any account
        run: |
          node scripts/publish-direct-registration.mjs --check-only
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/register-direct"
          curl --fail --silent --show-error --request OPTIONS --header 'Origin: https://econmind.group' --output /dev/null "$url"
          test "$(curl --silent --show-error --output "$RUNNER_TEMP/direct-negative.json" --write-out '%{http_code}' --request POST --header 'Origin: https://econmind.group' --header 'Content-Type: application/json' --data '{}' "$url")" = "400"
