name: Deploy Supabase backend

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending migrations to the linked EconMind project
        required: true
        type: boolean
        default: false
      deploy_workers:
        description: Deploy Edge Functions, including the continuous-world worker
        required: true
        type: boolean
        default: false
      apply_auth_config:
        description: Apply hosted Auth settings and email templates from config.toml
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Verify protected configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
      - name: Link target project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply Auth configuration
        if: ${{ inputs.apply_auth_config }}
        run: supabase config push --project-ref "$SUPABASE_PROJECT_REF"
      - name: Preview pending migrations
        if: ${{ inputs.apply_migrations == false && inputs.deploy_workers == false && inputs.apply_auth_config == false }}
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run
      - name: Apply migrations
        if: ${{ inputs.apply_migrations }}
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        if: ${{ inputs.deploy_workers }}
        run: |
          supabase functions deploy collect-daily-economic-brief --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy process-league-world-round --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy process-continuous-world --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy moderate-account-access --project-ref "$SUPABASE_PROJECT_REF"
