name: Diagnose · World V2 snapshot key metadata only
run-name: World V2 key metadata only · @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      authorization_id:
        description: CT-SNAPSHOT-KEY-METADATA-37038527126-V1
        type: string
        required: true
      confirmation:
        description: METADATA_GO_WORLD_V2_SNAPSHOT_KEY_METADATA_ONCE
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independent guard then exactly one reveal=false GET; no raw response file
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          WORLD_V2_SNAPSHOT_KEY_METADATA_LOCK: ${{ vars.WORLD_V2_SNAPSHOT_KEY_METADATA_LOCK }}
          WORLD_V2_SNAPSHOT_KEY_METADATA_CONFIRMATION: ${{ inputs.confirmation }}
          WORLD_V2_SNAPSHOT_KEY_METADATA_AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        run: |
          mkdir -p artifacts/world-v2-snapshot-key-metadata
          node scripts/world-v2-snapshot-key-metadata.mjs diagnose-once artifacts/world-v2-snapshot-key-metadata/metadata.json
      - name: Preserve aggregate-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v2-snapshot-key-metadata-evidence
          path: artifacts/world-v2-snapshot-key-metadata/metadata.json
          if-no-files-found: warn
