name: CI · Verify source
run-name: Verify ${{ github.ref_name }} · @${{ github.actor }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  world-v2-source-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: world_source_storage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify actual PostgreSQL 17 new-scope denial without changing old-scope behavior
        env:
          PGPASSWORD: disposable-test-only
        run: |
          psql -h localhost -U postgres -d world_source_storage_test -v apply_deny=false -f scripts/test-world-v2-source-snapshot-storage.sql
          node scripts/run-world-v2-source-snapshot-release.mjs permissions-render "$RUNNER_TEMP/snapshot-permissions-request.json"
          collect() {
            jq -r .query "$RUNNER_TEMP/snapshot-permissions-request.json" \
              | psql -qAt -v ON_ERROR_STOP=1 -h localhost -U postgres -d world_source_storage_test \
              | jq -s 'map({evidence: .})' > "$1"
          }
          collect "$RUNNER_TEMP/snapshot-permissions-before.json"
          if node scripts/run-world-v2-source-snapshot-release.mjs permissions-verify "$RUNNER_TEMP/snapshot-permissions-before.json" > /dev/null 2>&1; then
            echo 'Broad existing PUBLIC Storage policies unexpectedly passed'
            exit 1
          fi
          psql -h localhost -U postgres -d world_source_storage_test -v apply_deny=true -f scripts/test-world-v2-source-snapshot-storage.sql
          collect "$RUNNER_TEMP/snapshot-permissions-after.json"
          node scripts/run-world-v2-source-snapshot-release.mjs permissions-verify "$RUNNER_TEMP/snapshot-permissions-after.json"

  member-identity-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: member_identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise member identity permissions in disposable PostgreSQL
        env:
          PGPASSWORD: disposable-test-only
        run: psql -h localhost -U postgres -d member_identity_test -f scripts/test-member-identity.sql

  season1-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: season1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise Season 1 migration and permissions in disposable PostgreSQL
        env:
          PGPASSWORD: disposable-test-only
        run: psql -h localhost -U postgres -d season1_test -f scripts/test-season1-my-team.sql

  world-v2-edge-role:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: world_v2_edge_role_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise one guarded LOGIN activation without a production credential
        env:
          PGPASSWORD: disposable-test-only
        run: |
          psql -h localhost -U postgres -d world_v2_edge_role_test -f scripts/test-world-v2-edge-reader-provision.sql
          node scripts/world-v2-edge-reader-provision.mjs render-preflight "$RUNNER_TEMP/world-v2-edge-baseline-request.json"
          jq -r .query "$RUNNER_TEMP/world-v2-edge-baseline-request.json" \
            | psql -qAt -v ON_ERROR_STOP=1 -h localhost -U postgres -d world_v2_edge_role_test \
            | jq -s 'map({evidence: .})' > "$RUNNER_TEMP/world-v2-edge-baseline-response.json"
          node scripts/world-v2-edge-reader-provision.mjs verify-preflight "$RUNNER_TEMP/world-v2-edge-baseline-response.json"
          node --input-type=module -e 'import { roleActivationSql } from "./scripts/world-v2-edge-reader-provision.mjs"; process.stdout.write(roleActivationSql("ab".repeat(48)))' \
            | psql -qAt -v ON_ERROR_STOP=1 -h localhost -U postgres -d world_v2_edge_role_test \
            > "$RUNNER_TEMP/world-v2-edge-role-after.json"
          jq -e '.login_role.can_login == true and .reader_role.can_login == false and (.login_memberships | length) == 1' \
            "$RUNNER_TEMP/world-v2-edge-role-after.json"
          if node --input-type=module -e 'import { roleActivationSql } from "./scripts/world-v2-edge-reader-provision.mjs"; process.stdout.write(roleActivationSql("ab".repeat(48)))' \
            | psql -qAt -v ON_ERROR_STOP=1 -h localhost -U postgres -d world_v2_edge_role_test \
            > /dev/null 2>&1; then
            echo 'Second activation unexpectedly succeeded'
            exit 1
          fi
          expect_blocked() {
            preflight_root="$(mktemp -d)"
            node scripts/world-v2-edge-reader-provision.mjs render-preflight "$preflight_root/request.json"
            jq -r .query "$preflight_root/request.json" \
              | psql -qAt -v ON_ERROR_STOP=1 -h localhost -U postgres -d world_v2_edge_role_test \
              | jq -s 'map({evidence: .})' > "$preflight_root/response.json"
            if node scripts/world-v2-edge-reader-provision.mjs verify-preflight "$preflight_root/response.json" > /dev/null 2>&1; then
              echo 'Forbidden effective access passed preflight'
              exit 1
            fi
            if node --input-type=module -e 'import { roleActivationSql } from "./scripts/world-v2-edge-reader-provision.mjs"; process.stdout.write(roleActivationSql("ab".repeat(48)))' \
              | psql -qAt -v ON_ERROR_STOP=1 -h localhost -U postgres -d world_v2_edge_role_test > /dev/null 2>&1; then
              echo 'Forbidden effective access unexpectedly passed'
              exit 1
            fi
            test "$(psql -qAt -h localhost -U postgres -d world_v2_edge_role_test -c "select rolcanlogin from pg_roles where rolname='world_v2_api_login'")" = "f"
          }
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d world_v2_edge_role_test \
            -c 'alter role world_v2_api_login nologin; create table public.synthetic_business(value text); grant select on public.synthetic_business to public;'
          expect_blocked
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d world_v2_edge_role_test \
            -c 'revoke select on public.synthetic_business from public; grant select(value) on public.synthetic_business to public;'
          expect_blocked
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d world_v2_edge_role_test \
            -c 'revoke select(value) on public.synthetic_business from public; grant maintain on public.synthetic_business to public;'
          expect_blocked
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d world_v2_edge_role_test \
            -c 'drop table public.synthetic_business; create function public.synthetic_mutator() returns integer language sql security definer as $$select 1$$;'
          expect_blocked
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d world_v2_edge_role_test \
            -c 'drop function public.synthetic_mutator(); create role synthetic_writer nologin; grant synthetic_writer to world_v2_api_reader with inherit false, set true;'
          expect_blocked

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workflow formatting
        run: pnpm exec prettier --check ".github/workflows/*.yml"

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
