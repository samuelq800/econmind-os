name: Auth · Deploy stable 60-minute codes
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: Optional owner-authorized inbox for two recovery test emails (no password update)
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      STABLE_EMAIL_TEST_ADDRESS: ${{ inputs.test_email }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Install only the approved migration and disabled feature secrets
        run: node scripts/deploy-stable-email-codes.mjs prepare "$RUNNER_TEMP/stable-email-state.json"
      - name: Deploy only the signed mail hook and verification bridge
        run: |
          supabase functions deploy stable-auth-email --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy verify-stable-email --project-ref "$SUPABASE_PROJECT_REF"
      - name: Check deployed verifier readiness without requesting mail
        run: |
          curl --fail --silent --show-error --request OPTIONS \
            --header 'Origin: https://econmind.group' \
            --output /dev/null \
            "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/verify-stable-email"
      - name: Wait for the matching website release before changing mail contents
        run: |
          for attempt in $(seq 1 40); do
            conclusion="$(gh run list --workflow deploy-pages.yml --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion')"
            if [ "$conclusion" = success ]; then exit 0; fi
            if [ "$conclusion" = failure ] || [ "$conclusion" = cancelled ]; then echo 'Website release failed; native mail remains unchanged.'; exit 1; fi
            sleep 15
          done
          echo 'Matching website release not confirmed; native mail remains unchanged.'
          exit 1
      - name: Activate with independent readback and optional real-mail test
        run: node scripts/deploy-stable-email-codes.mjs activate "$RUNNER_TEMP/stable-email-state.json"
