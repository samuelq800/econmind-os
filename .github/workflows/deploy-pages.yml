name: Deploy EconMind OS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Verify required Supabase schema
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --request POST \
            --header "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --header "Content-Type: application/json" \
            --data '{}' \
            --output /dev/null \
            "${NEXT_PUBLIC_SUPABASE_URL%/}/rest/v1/rpc/get_public_league_directory_v2"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --get \
            --header "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --data-urlencode "select=account_status" \
            --data-urlencode "limit=0" \
            --output /dev/null \
            "${NEXT_PUBLIC_SUPABASE_URL%/}/rest/v1/profiles"

      - name: Export static website
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: "https://econmind.group"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ENABLE_CONTINUOUS_WORLD: ${{ vars.NEXT_PUBLIC_ENABLE_CONTINUOUS_WORLD }}
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
