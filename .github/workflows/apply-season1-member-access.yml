name: Maintenance · Season 1 member access
run-name: Apply Season 1 member access · @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
      - name: Apply and verify participant-scoped pending applications
        run: |
          payload="$(node <<'NODE'
          const fs = require('fs');
          const migration = fs.readFileSync(
            'supabase/migrations/20260924000000_season1_member_lobby_access.sql',
            'utf8',
          );
          const verification = String.raw`
          do $verify$
          begin
            if to_regprocedure('public.get_world_preseason_my_pending_team_ids()') is null
              or not has_function_privilege('authenticated', 'public.get_world_preseason_my_pending_team_ids()', 'EXECUTE')
              or has_function_privilege('anon', 'public.get_world_preseason_my_pending_team_ids()', 'EXECUTE')
            then
              raise exception 'Season 1 member application access is unavailable or incorrectly granted';
            end if;
          end
          $verify$;
          `;
          process.stdout.write(JSON.stringify({ query: `${migration}\n${verification}` }));
          NODE
          )"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data "$payload"
