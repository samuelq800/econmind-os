name: Update · World V2 existing reviewed reader only
run-name: Update World V2 reviewed reader only · @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      authorization_id:
        description: CT-WORLD-V2-READER-CORS-UPDATE-V1
        type: string
        required: true
      confirmation:
        description: UPDATE_WORLD_V2_READER_CORS_ONCE
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  reader-update-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Independent guard before source fetch or production contact
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          WORLD_V2_READER_UPDATE_LOCK: ${{ vars.WORLD_V2_READER_UPDATE_LOCK }}
          WORLD_V2_READER_UPDATE_CONFIRMATION: ${{ inputs.confirmation }}
          WORLD_V2_READER_UPDATE_AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        run: node scripts/world-v2-reader-cors-update.mjs guard
      - name: Fetch exact reviewed merged World reader source
        run: |
          git clone --no-checkout https://github.com/samuelq800/econmind-os-world-simulation.git "$RUNNER_TEMP/world-v2-reader-cors-source"
          git -C "$RUNNER_TEMP/world-v2-reader-cors-source" checkout --detach "$(node scripts/world-v2-reader-cors-update.mjs source-sha)"
      - name: Two exact v1 preimages then one fixed reader update and two-origin HTTP checks
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          WORLD_V2_READER_UPDATE_LOCK: ${{ vars.WORLD_V2_READER_UPDATE_LOCK }}
          WORLD_V2_READER_UPDATE_CONFIRMATION: ${{ inputs.confirmation }}
          WORLD_V2_READER_UPDATE_AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        run: |
          mkdir -p artifacts/world-v2-reader-cors-update
          node scripts/world-v2-reader-cors-update.mjs update-once "$RUNNER_TEMP/world-v2-reader-cors-source" artifacts/world-v2-reader-cors-update/evidence.json
      - name: Preserve sanitized identity hashes and bounded route evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-v2-reader-cors-update-evidence
          path: artifacts/world-v2-reader-cors-update/evidence.json
          if-no-files-found: warn
