name: Auth · Deploy reusable group registration
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      GROUP_REGISTRATION_CODE_HASH: ${{ secrets.GROUP_REGISTRATION_CODE_HASH }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Require matching source verification
        run: |
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 --json conclusion > "$RUNNER_TEMP/group-ci.json"
          node --input-type=module -e 'import fs from "node:fs"; if (!JSON.parse(fs.readFileSync(process.argv[1])).some(r => r.conclusion === "success")) throw Error("Matching CI has not passed")' "$RUNNER_TEMP/group-ci.json"
      - name: Install only the reviewed group migration
        run: node scripts/deploy-group-registration.mjs prepare "$RUNNER_TEMP/group-state.json"
      - name: Deploy only the group registration function
        run: supabase functions deploy register-with-group-code --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify deployed preflight
        run: |
          curl --fail --silent --show-error --request OPTIONS --header 'Origin: https://econmind.group' --output /dev/null "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/register-with-group-code"
      - name: Require matching website release
        run: |
          gh run list --workflow deploy-pages.yml --commit "$GITHUB_SHA" --limit 20 --json conclusion > "$RUNNER_TEMP/group-pages.json"
          node --input-type=module -e 'import fs from "node:fs"; if (!JSON.parse(fs.readFileSync(process.argv[1])).some(r => r.conclusion === "success")) throw Error("Matching website has not passed")' "$RUNNER_TEMP/group-pages.json"
      - name: Activate reusable code with readback
        run: node scripts/deploy-group-registration.mjs activate "$RUNNER_TEMP/group-state.json"
