name: Apply Yale Run scoreboard schema
run-name: Apply Yale Run scoreboard schema · @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
      - name: Apply the versioned Yale Run scoreboard migration
        run: |
          payload="$(node <<'NODE'
          const fs = require('fs');
          const migration = fs.readFileSync(
            'supabase/migrations/20260910010000_yale_run_global_high_score.sql',
            'utf8',
          );
          const verification = String.raw`
          do $verify$
          begin
            if not exists (
              select 1
              from pg_class relation
              join pg_namespace namespace on namespace.oid = relation.relnamespace
              where namespace.nspname = 'public'
                and relation.relname = 'yale_run_global_scores'
                and relation.relrowsecurity
            ) then
              raise exception 'Yale Run scoreboard table is missing or RLS is disabled';
            end if;

            if to_regprocedure('public.get_yale_run_global_high_score()') is null
              or to_regprocedure('public.submit_yale_run_score(integer)') is null
            then
              raise exception 'Yale Run scoreboard RPCs were not installed';
            end if;

            if public.get_yale_run_global_high_score() < 0 then
              raise exception 'Yale Run Global High cannot be negative';
            end if;
          end
          $verify$;
          `;
          process.stdout.write(JSON.stringify({ query: `${migration}\n${verification}` }));
          NODE
          )"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data "$payload"
