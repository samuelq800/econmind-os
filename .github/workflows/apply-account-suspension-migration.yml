name: Maintenance · Account suspension schema
run-name: Apply account suspension schema · @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
      - name: Apply the existing account suspension migration
        run: |
          payload="$(node <<'NODE'
          const fs = require('fs');
          const migration = fs.readFileSync(
            'supabase/migrations/20260831010000_add_reversible_account_suspension.sql',
            'utf8',
          );
          const verification = String.raw`
          do $verify$
          begin
            if not exists (
              select 1
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'profiles'
                and column_name = 'account_status'
                and data_type = 'text'
                and is_nullable = 'NO'
                and column_default = '''active''::text'
            ) then
              raise exception 'profiles.account_status was not installed as intended';
            end if;

            if not exists (
              select 1
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'profiles'
                and column_name = 'account_status_changed_at'
                and data_type = 'timestamp with time zone'
            ) or not exists (
              select 1
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'profiles'
                and column_name = 'account_status_changed_by'
                and data_type = 'uuid'
            ) then
              raise exception 'profiles account suspension audit fields were not installed';
            end if;
          end
          $verify$;
          `;
          process.stdout.write(JSON.stringify({ query: `${migration}\n${verification}` }));
          NODE
          )"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data "$payload"
