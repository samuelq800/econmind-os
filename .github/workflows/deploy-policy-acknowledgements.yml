name: Legal · Activate eight-document confirmation
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261021020000_policy_acknowledgement_release.sql"
      - "scripts/publish-policy-acknowledgements.mjs"
      - "scripts/verify-policy-acknowledgements.sql"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  activate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[policy-ack]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      POLICY_ACKNOWLEDGEMENT_APPROVED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - run: pnpm install --frozen-lockfile
      - name: Verify exact activation source
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/policy-acknowledgement.test.ts tests/policy-acknowledgement-publisher.test.ts tests/group-registration.test.ts
      - name: Apply only the explicit policy receipt migration
        run: node scripts/publish-policy-acknowledgements.mjs
      - name: Synchronise only group-registration legal version validation
        run: supabase functions deploy register-with-group-code --project-ref "$SUPABASE_PROJECT_REF"
      - name: Read back the prepared policy backend
        run: node scripts/publish-policy-acknowledgements.mjs --check-only
