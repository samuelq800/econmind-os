name: Apply university partner registration
run-name: Apply university partner registration · @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
      - name: Register university partners and profile links
        run: |
          payload="$(node <<'NODE'
          const fs = require('fs');
          const migration = fs.readFileSync(
            'supabase/migrations/20260910000000_register_university_partners.sql',
            'utf8',
          );
          const verification = String.raw`
          do $verify$
          begin
            if (
              select count(distinct public.econmind_school_identity_key(name))
              from public.schools
              where status = 'approved'
                and public.econmind_school_identity_key(name) = any(array[
                  'shanghaiinternationalstudiesuniversity',
                  'theuniversityofmelbourne',
                  'dukeuniversity',
                  'universityofcambridge',
                  'ucla'
                ])
            ) <> 5 then
              raise exception 'The five requested university partner records were not registered';
            end if;

            if not exists (
              select 1
              from public.profiles profile
              join public.schools school on school.id = profile.school_id
              where lower(trim(profile.display_name)) = 'leo'
                and school.name = 'University of Cambridge'
            ) then
              raise exception 'Leo was not linked to University of Cambridge';
            end if;

            if not exists (
              select 1
              from public.profiles profile
              join public.schools school on school.id = profile.school_id
              where lower(trim(profile.display_name)) = 'joanna zou'
                and school.name = 'UCLA'
            ) then
              raise exception 'Joanna Zou was not linked to UCLA';
            end if;
          end
          $verify$;
          `;
          process.stdout.write(JSON.stringify({ query: `${migration}\n${verification}` }));
          NODE
          )"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --data "$payload"
