project_id = "econmind-os"
[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[auth]
enabled = true
site_url = "https://econmind.group"
additional_redirect_urls = [
  "https://econmind.group/**",
  "https://www.econmind.group/**",
  "https://samuelq800.github.io/econmind-os/**",
  "http://localhost:3000/**",
]
enable_signup = true
# Live World participants receive a separate, temporary anonymous session.
# It is stored under a different browser key and never replaces their normal
# EconMind account session.
enable_anonymous_sign_ins = true
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.template.confirmation]
subject = "Your EconMind OS verification code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your EconMind OS password"
content_path = "./supabase/templates/recovery.html"

# Keep hosted-project Storage Vector disabled. Leaving this implicit causes a
# config push to request a paid Vector Buckets feature that this project does
# not use.
[storage.vector]
enabled = false

# The collector verifies either a teacher session or DAILY_BRIEF_CRON_SECRET
# inside the function. The scheduled call uses the latter, which is not a JWT.
[functions.collect-daily-economic-brief]
verify_jwt = false

[functions.process-league-world-round]
verify_jwt = false

# The continuous-world worker accepts either a league administrator session or
# CONTINUOUS_WORLD_CRON_SECRET. The secret belongs only in Edge Function/cron
# configuration, never in the public GitHub Pages build.
[functions.process-continuous-world]
verify_jwt = false

[functions.moderate-account-access]
verify_jwt = true

# Each mail endpoint authenticates in its handler. send-admin-email also retains
# the existing user-function JWT gateway check, then uses auth.getUser(token) and
# checks profiles.platform_role. The machine endpoints require HMAC or a dedicated
# Brevo Bearer token, never a user JWT.
[functions.send-admin-email]
verify_jwt = true

[functions.ingest-admin-email]
verify_jwt = false

[functions.brevo-mail-events]
verify_jwt = false
